name: Build Windows exe

on:
  workflow_dispatch:
  push:

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: rustup target add x86_64-pc-windows-msvc
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Check the exe and package it
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\spotifast.exe"
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -le 0) { throw "no exe built" }
          & $exe --version
          New-Item -ItemType Directory -Force dist\spotifast | Out-Null
          Copy-Item $exe, README.md, LICENSE, packaging\spotifast-portable.txt dist\spotifast\
          Compress-Archive -Path dist\spotifast -DestinationPath dist\spotifast-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: spotifast-windows-x64
          path: dist/spotifast-windows-x64.zip
          if-no-files-found: error
